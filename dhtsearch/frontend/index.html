<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHT Search Engine</title>
    <!-- TailwindCSS & DaisyUI via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.7.3/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .highlight { background-color: #ffd700; color: #000; font-weight: bold; padding: 0 2px; border-radius: 2px; }
        .collapse-title, :where(.collapse > input[type="checkbox"]) { min-height: 2.5rem; padding: 0.5rem 1rem; }
    </style>
</head>
<body class="bg-base-200 min-h-screen">
    <div class="container mx-auto p-4 max-w-5xl">
        
        <!-- Header & Stats -->
        <div class="flex justify-between items-center mb-8 mt-4">
            <div>
                <h1 class="text-4xl font-bold text-primary flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75l-2.489-2.489m0 0a3.375 3.375 0 10-4.773-4.773 3.375 3.375 0 004.774 4.774zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    DHT Search
                </h1>
                <p class="text-sm text-base-content/70 mt-1" id="stats-text">Loading stats...</p>
            </div>
            
            <!-- Theme Controller (Optional) -->
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="light" />
                <svg class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
                <svg class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/></svg>
            </label>
        </div>

        <!-- Search Box -->
        <div class="card bg-base-100 shadow-xl mb-8">
            <div class="card-body p-6">
                <form id="search-form" class="flex flex-col md:flex-row gap-4">
                    <select id="search-type" class="select select-bordered w-full md:w-48 text-base font-semibold">
                        <option value="name">Torrent Name</option>
                        <option value="hash">InfoHash</option>
                        <option value="file">File Contents</option>
                    </select>
                    <select id="search-sort" class="select select-bordered w-full md:w-48 text-base font-semibold">
                        <option value="desc">Newest First</option>
                        <option value="asc">Oldest First</option>
                    </select>
                    <select id="search-limit" class="select select-bordered w-full md:w-32 text-base font-semibold">
                        <option value="25">25 / page</option>
                        <option value="50">50 / page</option>
                        <option value="100">100 / page</option>
                    </select>
                    <div class="join w-full">
                        <input type="text" id="search-input" placeholder="Search..." class="input input-bordered join-item w-full" autofocus />
                        <button type="submit" id="search-btn" class="btn btn-primary join-item">
                            <span id="search-spinner" class="loading loading-spinner hidden"></span>
                            Search
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results Area -->
        <div id="results-meta" class="mb-4 text-sm text-base-content/70 hidden">
            Found <span id="results-count" class="font-bold text-base-content">0</span> results across <span id="total-torrents-count" class="font-bold text-base-content">0</span> torrents indexed in <span id="results-time" class="font-bold text-base-content">0</span>ms.
        </div>

        <div id="results-container" class="space-y-4 mb-8">
            <!-- Results injected here -->
        </div>

        <!-- Pagination Area -->
        <div id="pagination-container" class="flex justify-center mb-16 hidden">
            <div class="join" id="pagination-join">
                <!-- Pagination buttons injected here -->
            </div>
        </div>

    </div>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const typeSelect = document.getElementById('search-type');
        const sortSelect = document.getElementById('search-sort');
        const limitSelect = document.getElementById('search-limit');
        const btn = document.getElementById('search-btn');
        const spinner = document.getElementById('search-spinner');
        const resultsContainer = document.getElementById('results-container');
        const resultsMeta = document.getElementById('results-meta');
        const resultsCount = document.getElementById('results-count');
        const resultsTime = document.getElementById('results-time');
        const paginationContainer = document.getElementById('pagination-container');
        const paginationJoin = document.getElementById('pagination-join');

        let currentPage = 1;
        let currentQuery = '';
        let totalTorrents = 0;

        // Load stats on startup
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                totalTorrents = data.torrents || 0;
                const formattedTorrents = totalTorrents.toLocaleString();
                document.getElementById('stats-text').textContent = `Searching across ${formattedTorrents} torrents in ${data.files} DB file(s).`;
            }).catch(() => {
                document.getElementById('stats-text').textContent = 'Backend offline.';
            });

        // Format bytes to human readable
        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function highlight(text, query) {
            if (!query) return escapeHtml(text);
            const escapedText = escapeHtml(text);
            const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
            return escapedText.replace(regex, '<span class="highlight">$1</span>');
        }

        function escapeHtml(unsafe) {
            return (unsafe||"").toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;
            currentQuery = q;
            currentPage = 1;
            performSearch();
        });

        async function performSearch() {
            if (!currentQuery) return;

            const type = typeSelect.value;
            const sort = sortSelect.value;
            const limit = limitSelect.value;
            
            // Set loading state
            btn.disabled = true;
            spinner.classList.remove('hidden');
            resultsContainer.innerHTML = '';
            resultsMeta.classList.add('hidden');
            paginationContainer.classList.add('hidden');

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(currentQuery)}&type=${type}&sort=${sort}&limit=${limit}&page=${currentPage}`);
                const data = await res.json();
                
                resultsMeta.classList.remove('hidden');
                resultsCount.textContent = data.Count || 0;
                resultsTime.textContent = data.TimeMs || 0;
                document.getElementById('total-torrents-count').textContent = totalTorrents.toLocaleString();

                if (!data.Items || data.Items.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="alert shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-info shrink-0 w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h3 class="font-bold">No results found!</h3>
                                <div class="text-xs">Try adjusting your search query or selecting a different search type.</div>
                            </div>
                        </div>`;
                    return;
                }

                data.Items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card bg-base-100 shadow-xl border border-base-300';
                    
                    const date = new Date(item.DiscoveredOn * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                    const magnet = `magnet:?xt=urn:btih:${item.InfoHash}&dn=${encodeURIComponent(item.Name)}`;
                    
                    let filesHtml = '';
                    if (item.Files && item.Files.length > 0) {
                        let innerFiles = item.Files.map(f => {
                            let fPath = type === 'file' ? highlight(f.Path, currentQuery) : escapeHtml(f.Path);
                            return `
                                <div class="flex justify-between items-center py-1 border-b border-base-200 last:border-0 hover:bg-base-200 transition-colors px-2 rounded">
                                    <span class="text-sm truncate mr-4" title="${escapeHtml(f.Path)}">${fPath}</span>
                                    <span class="text-xs text-base-content/60 whitespace-nowrap">${formatBytes(f.Size)}</span>
                                </div>
                            `;
                        }).join('');

                        filesHtml = `
                            <div class="collapse collapse-arrow border border-base-300 bg-base-200 mt-4 rounded-box">
                                <input type="checkbox" /> 
                                <div class="collapse-title text-sm font-medium">
                                    Show Files (${item.Files.length})
                                </div>
                                <div class="collapse-content px-4 pb-4">
                                    <div class="max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                                        ${innerFiles}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    const cats = (item.Categories || []).map(c => `<div class="badge badge-outline">${escapeHtml(c)}</div>`).join('');
                    const nameHtml = type === 'name' ? highlight(item.Name, currentQuery) : escapeHtml(item.Name);
                    const hashHtml = type === 'hash' ? highlight(item.InfoHash, currentQuery) : escapeHtml(item.InfoHash);

                    card.innerHTML = `
                        <div class="card-body p-6">
                            <div class="flex justify-between items-start gap-4">
                                <div class="flex-1 min-w-0">
                                    <h2 class="card-title text-xl break-words leading-tight mb-2">${nameHtml}</h2>
                                    <div class="flex flex-wrap gap-2 mb-3">
                                        <div class="badge badge-primary font-semibold">${formatBytes(item.TotalSize)}</div>
                                        <div class="badge badge-ghost">${date}</div>
                                        ${cats}
                                    </div>
                                    <div class="text-xs font-mono text-base-content/50 break-all mb-4">
                                        Hash: ${hashHtml}
                                    </div>
                                </div>
                                <a href="${magnet}" class="btn btn-secondary btn-sm md:btn-md gap-2 shadow-sm shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                                    </svg>
                                    Magnet
                                </a>
                            </div>
                            ${filesHtml}
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });

                renderPagination(data.TotalPages, data.CurrentPage);

            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = `<div class="alert alert-error">Error fetching results: ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        function renderPagination(totalPages, current) {
            if (totalPages <= 1) return;
            
            paginationContainer.classList.remove('hidden');
            paginationJoin.innerHTML = '';

            // Previous Button
            const prevBtn = document.createElement('button');
            prevBtn.className = 'join-item btn';
            if (current === 1) prevBtn.disabled = true;
            prevBtn.textContent = '«';
            prevBtn.onclick = () => { currentPage = current - 1; performSearch(); };
            paginationJoin.appendChild(prevBtn);

            // Page numbers
            let startPage = Math.max(1, current - 2);
            let endPage = Math.min(totalPages, current + 2);

            if (startPage > 1) {
                const firstBtn = document.createElement('button');
                firstBtn.className = 'join-item btn';
                firstBtn.textContent = '1';
                firstBtn.onclick = () => { currentPage = 1; performSearch(); };
                paginationJoin.appendChild(firstBtn);
                
                if (startPage > 2) {
                    const dots = document.createElement('button');
                    dots.className = 'join-item btn btn-disabled';
                    dots.textContent = '...';
                    paginationJoin.appendChild(dots);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `join-item btn ${i === current ? 'btn-active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => { currentPage = i; performSearch(); };
                paginationJoin.appendChild(pageBtn);
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const dots = document.createElement('button');
                    dots.className = 'join-item btn btn-disabled';
                    dots.textContent = '...';
                    paginationJoin.appendChild(dots);
                }
                const lastBtn = document.createElement('button');
                lastBtn.className = 'join-item btn';
                lastBtn.textContent = totalPages;
                lastBtn.onclick = () => { currentPage = totalPages; performSearch(); };
                paginationJoin.appendChild(lastBtn);
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.className = 'join-item btn';
            if (current === totalPages) nextBtn.disabled = true;
            nextBtn.textContent = '»';
            nextBtn.onclick = () => { currentPage = current + 1; performSearch(); };
            paginationJoin.appendChild(nextBtn);
        }
    </script>
</body>
</html>
